<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ressources</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <link rel="stylesheet" href="../assets/style/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../tools/prism/prism.min.css">
    <link rel="stylesheet" href="../assets/style/theme.css">
    <script src="../assets/scripts/custom-css.js"></script>
</head>

<body>
    <NavBarComponent title="Ressources"></NavBarComponent>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Files</h1>
                <p>Resources uploaded to your workspace.</p>
            </div>
            <div class="toolbar">
                <button onclick="redirect('ressourceForm.html')" id="createBtn"><i class="fas fa-plus"></i> New file</button>
            </div>
        </div>
        <TableComponent id="ressourceTable" onLoadColumns="onLoadColumns" onLoadData="onLoadData"
            onLoadAction="onLoadAction" paginationMethod="getRessources" createPermission="create_resource">
        </TableComponent>

    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Loader.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <!-- Pdf Tool -->
    <script src="../tools/pdf.js"></script>
    <script src="../tools/prism/prism.min.js"></script>
    <script src="../tools/prism/components/prism-javascript.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>
    <script src="../managers/user_manager.js"></script>

    <!-- User objects -->
    <script src="../services/ressourceService.js"></script>
    <script src="../models/ressource.js"></script>
    <script src="../managers/ressource_manager.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../actions/dashboard-ressources.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/table.js"></script>

</body>

</html>
