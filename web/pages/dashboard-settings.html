<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Settings</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <link rel="stylesheet" href="../assets/style/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/style/theme.css">
    <script src="../assets/scripts/custom-css.js"></script>
</head>

<body>
    <NavBarComponent title="Settings"></NavBarComponent>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Settings</h1>
                <p>Application-wide configuration.</p>
            </div>
            <div class="toolbar">
                <button class="btn-secondary" onclick="printSettings()" id="createBtn"><i class="fas fa-print"></i> Print</button>
            </div>
        </div>
        <TableComponent id="settingTable" onLoadColumns="onLoadColumns" onLoadData="onLoadData"
            onLoadAction="onLoadAction" paginationMethod="getSettings" createPermission="create_settings">
        </TableComponent>
    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Loader.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <script src="../tools/html2pdf/html2pdf.bundle.min.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>
    <script src="../managers/user_manager.js"></script>

    <script src="../services/settingService.js"></script>
    <script src="../models/setting.js"></script>
    <script src="../managers/setting_manager.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../actions/dashboard-settings.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/table.js"></script>

</body>

</html>
