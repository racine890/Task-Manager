<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Worker Assignations</title>
	<link rel="stylesheet" href="../assets/style/states.css">
	<link rel="stylesheet" href="../assets/style/dashboard.css">
    <link rel="stylesheet" href="../assets/style/fontawesome/css/all.min.css">
</head>

<body>
	<NavBarComponent title="Worker Assignations"></NavBarComponent>

	<div class="page-wrapper">
		<div class="container" id="container">

			<div class="header">
				<div class="profile">
					<div class="avatar" id="initials">CD</div>
					<div class="profile-info">
						<h2 id="name">Claire Dubois</h2>
						<p id="job">Worker</p>
						<p id="email">claire.dubois@entreprise.com</p>
					</div>
				</div>

				<div class="stats">
					<div class="stat-card">
						<div class="stat-icon"><i class="fas fa-list-check"></i></div>
						<div class="stat-info">
							<h3 id="active_tasks">0</h3>
							<span>Active tasks</span>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon"><i class="fas fa-spinner"></i></div>
						<div class="stat-info">
							<h3 id="started_tasks">0</h3>
							<span>Started tasks</span>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon"><i class="fas fa-triangle-exclamation"></i></div>
						<div class="stat-info">
							<h3 id="delayed">0</h3>
							<span>Delayed</span>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon"><i class="fas fa-diagram-project"></i></div>
						<div class="stat-info">
							<h3 id="running_projects">0</h3>
							<span>Running projects</span>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon"><i class="fas fa-chart-line"></i></div>
						<div class="stat-info">
							<h3 id="progression">0%</h3>
							<span>Avg progression</span>
						</div>
					</div>
				</div>
			</div>

			<div id="sections-container"></div>

			<div id="loader" class="loader">Loading...</div>
			<div id="sentinel"></div>

			<footer>
				Last update : <span id="last_update"></span> — Automatic individual report
			</footer>
		</div>
	</div>

	<script src="../core/Service.js"></script>
	<script src="../core/Model.js"></script>
	<script src="../core/DataManager.js"></script>
	<script src="../core/Component.js"></script>

	<script src="../services/userService.js"></script>
	<script src="../models/user.js"></script>
	<script src="../managers/user_manager.js"></script>
	<script src="../components/navbar.js"></script>
	<script src="../actions/utils.js"></script>
	<script src="../actions/init_global.js"></script>

	<script src="../actions/stateUserAffectations.js"></script>
</body>

</html>
