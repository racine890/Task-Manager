<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Users</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <link rel="stylesheet" href="../assets/style/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/style/theme.css">
    <script src="../assets/scripts/custom-css.js"></script>
</head>
<body>
    <NavBarComponent title="Users"></NavBarComponent>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Profiles</h1>
                <p>Manage users, rights and assignments.</p>
            </div>
            <div class="toolbar">
                <button class="btn-secondary" onclick="printUsers()"><i class="fas fa-print"></i> Print</button>
                <button onclick="redirect('userForm.html')"><i class="fas fa-plus"></i> New user</button>
            </div>
        </div>
        <table id="to-print">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="my-table">
                <!-- Les projets seront ajoutés ici par JavaScript -->
            </tbody>

        </table>
        <div class="pagination">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
        </div>
    </div>
    <!-- Core scripts -->
	<script src="../core/Service.js"></script>
	<script src="../core/Loader.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <script src="../tools/html2pdf/html2pdf.bundle.min.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>
    <script src="../managers/user_manager.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../actions/dashboard-users.js"></script>
    <script src="../components/navbar.js"></script>

</body>
</html>
