<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Form</title>
    <link rel="stylesheet" href="../assets/style/forms.css">
    <link rel="stylesheet" href="../assets/style/dashboard.css">
</head>

<body>
    <NavBarComponent title="Create an Idea"></NavBarComponent>
    <div class="form-container">
        <h1>Store an Idea</h1>
        <form id="ideaForm">
            <div class="form-group">
                <label for="project-id">Project :</label>
                <input type="hidden" id="project-id" name="project-id" value="">
                <div id="project-info">
                    <a href="#" onclick="openProject(current_project_id)" id="project-link"></a>
                </div>
            </div>
            <div class="form-group">
                <label for="title">Label :</label>
                <input class="form-field" type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="description">Description :</label>
                <textarea class="form-field" id="description" placeholder="Markdown supported" name="description"
                    rows="4" required></textarea>
            </div>
            <button type="submit" id="submission">Save</button>
            <button type="button" id="convert-btn" style="display: none" onclick="convertToTask()">Convert to Task</button>
        </form>
    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>

    <!-- Idea objects -->
    <script src="../services/ideaService.js"></script>
    <script src="../models/idea.js"></script>

    <!-- Project objects -->
    <script src="../services/projectService.js"></script>
    <script src="../models/project.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../managers/user_manager.js"></script>
    <script src="../managers/idea_manager.js"></script>
    <script src="../managers/project_manager.js"></script>
    <script src="../actions/save_idea.js"></script>
    <script src="../components/navbar.js"></script>
</body>

</html>
