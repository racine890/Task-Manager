<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Projects</title>
    <link rel="stylesheet" href="../assets/style/dashboard.css">
</head>

<body>
    <NavBarComponent title="Projects"></NavBarComponent>
    <div class="container">
        <button id="createBtn" onclick="redirect('projectForm.html')">Add</button>
        <button onclick="openRandomProject()">Open random</button>
        <button onclick="printProjects()">Print</button>

        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" value="0">
                New
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="1">
                Todo
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="2">
                Started
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="3">
                Paused
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="4">
                Testing
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="5">
                Finished
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="6">
                Abandoned
            </label>
        </div>

        <TableComponent id="projectTable" onLoadColumns="onLoadColumns" onLoadData="onLoadData"
            onLoadAction="onLoadAction" paginationMethod="getProjects" createPermission="create_project">
        </TableComponent>

    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <script src="../tools/html2pdf/html2pdf.bundle.min.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>

    <!-- Project objects -->
    <script src="../services/projectService.js"></script>
    <script src="../managers/project_manager.js"></script>
    <script src="../models/project.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../components/navbar.js"></script>
    <script src="../actions/dashboard-projects.js"></script>
    <script src="../managers/user_manager.js"></script>
    <script src="../components/table.js"></script>
</body>

</html>
