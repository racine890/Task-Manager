<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tasks</title>
    <link rel="stylesheet" href="../assets/style/dashboard.css">
</head>

<body>
    <NavBarComponent title="Tasks"></NavBarComponent>
    <div class="container">
        <!--button onclick="redirect('taskForm.html')">Add</button-->
        <button onclick="openRandomTask()">Open random</button>
        <button onclick="printTasks()">Print</button>

        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" value="0">
                New
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="1">
                Todo
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="2">
                Started
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="3">
                Paused
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="4">
                Testing
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="5">
                Finished
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="6">
                Feedback
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="7">
                Delivered
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="8">
                Abandoned
            </label>
        </div>

        <TableComponent id="taskTable" onLoadColumns="onLoadColumns" onLoadData="onLoadData" onLoadAction="onLoadAction"
            paginationMethod="getTasks"></TableComponent>

    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <script src="../tools/html2pdf/html2pdf.bundle.min.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>

    <!-- Idea objects -->
    <script src="../services/taskService.js"></script>
    <script src="../managers/task_manager.js"></script>
    <script src="../models/task.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../actions/dashboard-tasks.js"></script>
    <script src="../managers/user_manager.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/table.js"></script>

</body>

</html>
