<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Form</title>
    <link rel="stylesheet" href="../assets/style/forms.css">
    <link rel="stylesheet" href="../assets/style/dashboard.css">
</head>

<body>
    <NavBarComponent title="Create a Task"></NavBarComponent>
    <div class="form-container">
        <h1>Store a Task</h1>
        <form id="my-form">
            <div class="form-group">
                <label for="category">Category :</label>
                <select id="category">

                </select>
            </div>
            <div class="form-group">
                <label for="project">Project :</label>
                <input type="text" id="project-search" placeholder="Search a project...">
                <select id="project">
                    <option value="">-- Select a project --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="title">Label :</label>
                <input class="form-field" type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="description">Description :</label>
                <textarea class="form-field" id="description" placeholder="Markdown supported" name="description"
                    rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="start-date">Start date :</label>
                <input type="datetime-local" class="form-field" id="start-date" name="start-date" required>
            </div>
            <div class="form-group">
                <label for="end-date">End date :</label>
                <input type="datetime-local" class="form-field" id="end-date" name="end-date" required>
            </div>
            <div class="form-group">
                <label for="evaluated-hours">Nombre d'heures évalué :</label>
                <input class="form-field" type="number" id="evaluated-hours" name="evaluated-hours" step="0.5" placeholder="Optionnel">
            </div>
            <button type="submit" id="submission">Save</button>
        </form>
    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <!-- Category objects -->
    <script src="../models/category.js"></script>
    <script src="../services/categoryService.js"></script>
    <script src="../managers/category_manager.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>

    <!-- Project objects -->
    <script src="../services/projectService.js"></script>
    <script src="../models/project.js"></script>

    <!-- Idea objects -->
    <script src="../services/ideaService.js"></script>
    <script src="../models/idea.js"></script>

    <!-- Task objects -->
    <script src="../services/taskService.js"></script>
    <script src="../models/task.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../managers/user_manager.js"></script>
    <script src="../managers/task_manager.js"></script>
    <script src="../managers/idea_manager.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../actions/taskForm.js"></script>
</body>

</html>
