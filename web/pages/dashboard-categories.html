<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Categories</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <link rel="stylesheet" href="../assets/style/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/style/theme.css">
    <script src="../assets/scripts/custom-css.js"></script>
</head>

<body>
    <NavBarComponent title="Categories"></NavBarComponent>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Categories</h1>
                <p>Group projects and tasks, and define their workflow.</p>
            </div>
            <div class="toolbar">
                <button onclick="redirect('categoryForm.html')" id="createBtn"><i class="fas fa-plus"></i> New category</button>
            </div>
        </div>

        <TableComponent id="categoryTable" onLoadColumns="onLoadColumns" onLoadData="onLoadData"
            onLoadAction="onLoadAction" paginationMethod="getCategories"></TableComponent>

    </div>

    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Loader.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>
    <script src="../core/Action.js"></script>

    <script src="../components/table.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>

    <!-- Idea objects -->
    <script src="../services/categoryService.js"></script>
    <script src="../managers/category_manager.js"></script>
    <script src="../models/category.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../actions/dashboard-categories.js"></script>
    <script src="../managers/user_manager.js"></script>
    <script src="../components/navbar.js"></script>

</body>

</html>
