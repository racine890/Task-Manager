<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ideas</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <link rel="stylesheet" href="../assets/style/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/style/theme.css">
    <script src="../assets/scripts/custom-css.js"></script>
</head>

<body>
    <NavBarComponent title="Ideas"></NavBarComponent>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Ideas</h1>
                <p>Capture ideas before they become tasks.</p>
            </div>
            <div class="toolbar">
                <button class="btn-secondary" onclick="printIdeas()"><i class="fas fa-print"></i> Print</button>
                <button onclick="redirect('ideaForm.html')" id="createBtn"><i class="fas fa-plus"></i> New idea</button>
            </div>
        </div>

        <TableComponent id="ideaTable" onLoadColumns="onLoadColumns" onLoadData="onLoadData" onLoadAction="onLoadAction"
            paginationMethod="getIdeas" createPermission="create_idea"></TableComponent>

    </div>
    <!-- Core scripts -->
    <script src="../core/Service.js"></script>
    <script src="../core/Loader.js"></script>
    <script src="../core/Model.js"></script>
    <script src="../core/DataManager.js"></script>
    <script src="../core/Component.js"></script>

    <script src="../tools/html2pdf/html2pdf.bundle.min.js"></script>

    <!-- User objects -->
    <script src="../services/userService.js"></script>
    <script src="../models/user.js"></script>

    <!-- Idea objects -->
    <script src="../services/ideaService.js"></script>
    <script src="../managers/idea_manager.js"></script>
    <script src="../models/idea.js"></script>

    <!-- Initializers -->
    <script src="../actions/utils.js"></script>
    <script src="../actions/init_global.js"></script>

    <!-- Specific scripts -->
    <script src="../actions/dashboard-ideas.js"></script>
    <script src="../managers/user_manager.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/table.js"></script>

</body>

</html>
